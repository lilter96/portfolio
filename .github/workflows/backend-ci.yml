name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/check-coverage.py"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "scripts/check-coverage.py"
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build (warnings as errors)
        run: dotnet build --no-restore
        working-directory: backend

      - name: Run backend tests + coverage
        run: >
          dotnet test --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
        working-directory: backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: backend/TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/TestResults/**/coverage.cobertura.xml

      - name: Check coverage threshold
        run: python3 scripts/check-coverage.py backend/TestResults --threshold 30

      - name: Lint (dotnet format)
        run: dotnet format analyzers backend/Portfolio.slnx --verify-no-changes --no-restore
        continue-on-error: true

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore
        working-directory: backend

      - name: Run integration tests (Testcontainers)
        run: >
          dotnet test --no-build
          --filter "FullyQualifiedName~Integration.EndToEndTests"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults
        working-directory: backend
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-results
          path: backend/TestResults/**/*.trx
