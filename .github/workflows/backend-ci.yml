name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build (warnings as errors)
        run: dotnet build --no-restore
        working-directory: backend

      - name: Run unit tests
        run: >
          dotnet test --no-build
          --filter "FullyQualifiedName~Domain.Tests|FullyQualifiedName~Application.Tests|FullyQualifiedName~Infrastructure.Tests"
          --logger "trx;LogFileName=unit-tests.trx"
        working-directory: backend

  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore
        working-directory: backend

      - name: Run integration tests (Testcontainers)
        run: >
          dotnet test --no-build
          --filter "FullyQualifiedName~Integration.EndToEndTests"
          --logger "trx;LogFileName=integration-tests.trx"
        working-directory: backend
        env:
          # Testcontainers uses the Docker daemon on the runner
          DOCKER_HOST: unix:///var/run/docker.sock
