name: Docker Build


permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - target: api
            context: ./backend
            file: ./backend/Dockerfile
            image-tag: portfolio-api
          - target: web
            context: ./frontend
            file: ./frontend/Dockerfile
            image-tag: portfolio-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.target }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.target }}

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service.target }} to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image-tag }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image-tag }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.target }}
