name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript build (tsc + vite)
        run: npm run build
        working-directory: frontend

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend

      - name: Run tests + coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Install browser for public-profile checks
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build static public profile
        run: npm run build
        working-directory: frontend
        env:
          VITE_STATIC_SHOWCASE: "true"

      - name: Verify current CV contacts and dates in both languages
        run: npm run test:e2e -- e2e/profile-content.spec.ts --reporter=line
        working-directory: frontend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/cobertura-coverage.xml
            frontend/coverage/lcov.info
            frontend/coverage/lcov-report/
