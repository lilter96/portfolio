# ──────────────────────────────────────────────────────────────
# Nginx configuration — Portfolio SPA + API proxy
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;

    # ── Compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── Static assets (hashed filenames → long cache) ────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Unversioned static files (short cache) ─────────────
    location ~* \.(svg|png|webp|ico|txt|xml|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health checks ────────────────────────────────────────
    location /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── CV downloads (force download as attachment) ──────────
    location /cv/ {
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
